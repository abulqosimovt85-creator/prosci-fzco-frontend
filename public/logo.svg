<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <!-- Hexagonal icon with cube -->
  <g transform="translate(10, 15)">
    <!-- Outer hexagon -->
    <polygon points="50,0 95,25 95,75 50,100 5,75 5,25" stroke="#0066CC" stroke-width="2" fill="none"/>
    <!-- Inner hexagon -->
    <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="#00AAEE" stroke-width="1.5" fill="none"/>
    <!-- 3D cube -->
    <polygon points="50,30 65,38 65,62 50,70 35,62 35,38" fill="#0088DD" opacity="0.3"/>
    <polygon points="50,30 65,38 65,62 50,70" fill="#0066CC" opacity="0.5"/>
    <polygon points="50,30 35,38 35,62 50,70" fill="#00AAEE" opacity="0.4"/>
    <polygon points="35,38 50,30 65,38 50,46" fill="#0099EE" opacity="0.6"/>
  </g>

  <!-- PROSCIENTIFIC text -->
  <text x="130" y="50" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#081c44" letter-spacing="2">PROSCIENTIFIC</text>

  <!-- SOLUTIONS text -->
  <text x="130" y="78" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="300" fill="#153f78" letter-spacing="6">SOLUTIONS</text>

  <!-- Horizontal line -->
  <line x1="130" y1="88" x2="470" y2="88" stroke="#0066CC" stroke-width="1"/>

  <!-- Arabic text -->
  <text x="470" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#081c44" text-anchor="end" xml:lang="ar">بروسينتيفك سولوشنز - ش.م.خ</text>

  <!-- Tagline -->
  <text x="130" y="115" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666" letter-spacing="3">SMART SCIENCE. REAL IMPACT.</text>
</svg>